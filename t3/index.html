<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>T3 · Rótulo animado</title>
<script src="../assets/lib/aframe.min.js"></script>
<script src="../assets/lib/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, -apple-system, sans-serif; }
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px;
    background: #1b1410; color: #f3ead8; text-align: center; overflow-y: auto;
  }
  #start h1 { font-size: 21px; margin: 0; font-weight: 600; }
  #start p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 340px; opacity: .85; }
  .opt {
    width: 100%; max-width: 340px; padding: 14px 16px; border: 0; border-radius: 14px;
    background: #2a201a; color: #f3ead8; font-size: 15px; text-align: left;
  }
  .opt b { color: #c9a227; display: block; font-size: 16px; margin-bottom: 2px; }
  #warn { display: none; background: #7a2e1e; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; max-width: 340px; }
  #hud {
    position: fixed; left: 8px; right: 8px; bottom: 10px; z-index: 10;
    background: rgba(0,0,0,.62); color: #fff; font-size: 13px; line-height: 1.4;
    padding: 8px 10px; border-radius: 10px; display: none;
  }
  #hud b { color: #c9a227; }
  #hud button { margin: 6px 6px 0 0; padding: 6px 12px; font-size: 13px; border-radius: 8px; border: 0; }
</style>
</head>
<body>

<div id="start">
  <h1>T3 · Rótulo animado</h1>
  <p>Aponte para o rótulo do Allegro (Safra 2026) a uns 20–40 cm. Quando reconhecer, o rótulo ganha vida: a menina balança e as notas sobem.</p>
  <div id="warn"></div>
  <button class="opt" data-alvo="casa2" style="text-align:center"><b style="margin:0">Iniciar</b></button>
</div>

<div id="hud">
  <div>Alvo: <b id="alvo">–</b> · Status: <b id="st">carregando…</b></div>
  <div>Câmera abriu em: <b id="cam">–</b> · Reconheceu após: <b id="tf">–</b></div><div>Tolerância: <b id="tol">–</b> · Perdeu: <b id="lost">0</b>× · FPS: <b id="fps">–</b></div>
  <button id="copy">Copiar diagnóstico</button><button id="toggle">Ocultar animação</button><button id="estbtn">Estabilizador: ligado</button><button onclick="location.reload()">Reiniciar</button>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent;
  if (/Instagram|FBAN|FBAV|Line\/|Twitter/i.test(ua)) {
    $('warn').style.display = 'block';
    $('warn').textContent = 'Parece que você está no navegador interno de um app. Se a câmera não abrir, toque em "…" e escolha abrir no navegador padrão.';
  }

  // altura/largura de cada imagem de referência
  const ALVOS = {
    casa2:  { ratio: 984 / 850, nome: 'A2 · foto nova' },
    casa:   { ratio: 875 / 743, nome: 'A · foto da garrafa' },
    render: { ratio: 756 / 624, nome: 'B · estúdio' },
    antiga: { ratio: 817 / 712, nome: 'C · sem safra' }
  };


  // ---- Estabilizador: suaviza e "segura" a pose quando a variação é pequena ----
  const Q = new URLSearchParams(location.search);
  const EST = { on: Q.get('est') !== '0', a: parseFloat(Q.get('a') || '0.15'), dz: parseFloat(Q.get('dz') || '0.03'), dzAng: parseFloat(Q.get('ang') || '2'), n: parseInt(Q.get('n') || '7', 10), dzS: parseFloat(Q.get('dzs') || '0.04'), plano: Q.get('plano') !== '0' };
  AFRAME.registerComponent('estabilizar', {
    schema: { alvo: { type: 'selector' } },
    init() {
      this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
      this.cp = new THREE.Vector3(); this.cq = new THREE.Quaternion(); this.cs = new THREE.Vector3();
      this.tinha = false; this.hist = [];
      this.mp = new THREE.Vector3(); this.mq = new THREE.Quaternion();
      this.el.object3D.visible = false;
    },
    tick() {
      const t = this.data.alvo && this.data.alvo.object3D;
      const o = this.el.object3D;
      if (!t || !t.visible) { o.visible = false; this.tinha = false; this.hist = []; return; }
      t.matrix.decompose(this.p, this.q, this.s);
      if (EST.on && EST.n > 1) {
        // filtro de mediana na posição e média na rotação: descarta saltos de 1-2 quadros
        this.hist.push({ p: this.p.clone(), q: this.q.clone(), s: this.s.clone() });
        if (this.hist.length > EST.n) this.hist.shift();
        const med = (k, c = 'p') => { const v = this.hist.map(h => h[c][k]).sort((x, y) => x - y); return v[v.length >> 1]; };
        this.mp.set(med('x'), med('y'), med('z'));
        this.s.set(med('x', 's'), med('y', 's'), med('z', 's'));
        const ref = this.hist[this.hist.length - 1].q; let x = 0, y = 0, z = 0, w = 0;
        for (const h of this.hist) { const sg = (h.q.dot(ref) < 0) ? -1 : 1; x += sg*h.q.x; y += sg*h.q.y; z += sg*h.q.z; w += sg*h.q.w; }
        this.mq.set(x, y, z, w).normalize();
        this.p.copy(this.mp); this.q.copy(this.mq);
      }
      if (EST.on && EST.plano) {
        // mantém só o giro no plano da tela: elimina a "distorção" de inclinações mal estimadas
        const ex = new THREE.Vector3(1, 0, 0).applyQuaternion(this.q);
        const roll = Math.atan2(ex.y, ex.x);
        this.q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), roll);
        const esc = (this.s.x + this.s.y) / 2; this.s.set(esc, esc, esc);
      }
      if (!this.tinha || !EST.on) {
        this.cp.copy(this.p); this.cq.copy(this.q); this.cs.copy(this.s); this.tinha = true;
      } else {
        const largura = this.cs.x || 1;
        const dist = this.p.distanceTo(this.cp) / largura;
        const ang = this.q.angleTo(this.cq) * 180 / Math.PI;
        const dS = Math.abs(this.s.x - this.cs.x) / (this.cs.x || 1);
        if (dist > EST.dz || ang > EST.dzAng || dS > EST.dzS) {
          // quanto maior o movimento, mais rápido acompanha
          const k = Math.min(1, EST.a * (1 + Math.max(dist / EST.dz, ang / EST.dzAng, dS / EST.dzS) / 4));
          this.cp.lerp(this.p, k); this.cq.slerp(this.q, k); this.cs.lerp(this.s, k);
        }
      }
      o.position.copy(this.cp); o.quaternion.copy(this.cq); o.scale.copy(this.cs);
      o.visible = true;
    }
  });

  const TOL = parseInt(new URLSearchParams(location.search).get('tol') || '15', 10);
  let tReady = null;
  document.getElementById('tol').textContent = TOL;
  let t0 = null, firstFound = null, lostCount = 0, status = 'carregando', alvoAtual = null, fps = 0;
  const setStatus = (s) => { status = s; $('st').textContent = s; };

  const vid = document.createElement('video');
  vid.id = 'vid'; vid.src = '../assets/video/allegro_t3.mp4'; vid.loop = true; vid.muted = true;
  vid.setAttribute('playsinline', ''); vid.setAttribute('webkit-playsinline', ''); vid.crossOrigin = 'anonymous'; vid.preload = 'auto';
  vid.style.display = 'none'; document.body.appendChild(vid);

  function montar(alvo) {
    vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});
    alvoAtual = alvo;
    const a = ALVOS[alvo];
    const h = a.ratio.toFixed(4);
    $('start').style.display = 'none';
    $('hud').style.display = 'block';
    $('alvo').textContent = a.nome;
    setStatus('abrindo câmera…');
    t0 = performance.now();

    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <a-scene id="scene"
        mindar-image="imageTargetSrc: ../assets/targets/${alvo}.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: ${TOL}; warmupTolerance: 3"
        color-space="sRGB" renderer="colorManagement: true; antialias: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity id="stab" estabilizar="alvo: #target">
          <a-plane id="over" material="shader: flat; src: #vid" width="1" height="${h}"></a-plane>
        </a-entity>
      </a-scene>`;
    document.body.appendChild(wrap.firstElementChild);

    const scene = document.getElementById('scene');
    const target = document.getElementById('target');
    scene.addEventListener('arReady', () => { tReady = performance.now(); $('cam').textContent = ((tReady - t0)/1000).toFixed(1) + ' s'; setStatus('procurando o rótulo'); });
    scene.addEventListener('arError', () => setStatus('erro ao abrir a câmera'));
    target.addEventListener('targetFound', () => {
      if (firstFound === null) {
        firstFound = (performance.now() - (tReady || t0)) / 1000;
        $('tf').textContent = firstFound.toFixed(1) + ' s';
      }
      setStatus('rótulo reconhecido');
      vid.play().catch(() => {});
    });
    target.addEventListener('targetLost', () => { vid.pause(); lostCount++; $('lost').textContent = lostCount; setStatus('procurando o rótulo'); });
  }

  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => montar(b.dataset.alvo)));

  const atualizaEst = () => { $('estbtn').textContent = 'Estabilizador: ' + (EST.on ? 'ligado' : 'desligado'); };
  atualizaEst();
  $('estbtn').addEventListener('click', () => { EST.on = !EST.on; atualizaEst(); });


  let visivel = true;
  $('toggle').addEventListener('click', () => {
    visivel = !visivel;
    const o = document.getElementById('over');
    if (o) o.setAttribute('visible', visivel);
    $('toggle').textContent = visivel ? 'Ocultar animação' : 'Mostrar animação';
  });

  let frames = 0, last = performance.now();
  (function loop(now) {
    frames++;
    if (now - last >= 1000) { fps = Math.round(frames * 1000 / (now - last)); $('fps').textContent = fps; frames = 0; last = now; }
    requestAnimationFrame(loop);
  })(performance.now());

  $('copy').addEventListener('click', async () => {
    const txt = [
      'Teste: T3 · animação · alvo ' + alvoAtual,
      'Status: ' + status,
      'Câmera abriu em: ' + $('cam').textContent,
      'Reconheceu após (com câmera aberta): ' + (firstFound === null ? 'não reconheceu' : firstFound.toFixed(1) + ' s'),
      'Tolerância: ' + TOL,
      'Estabilizador: ' + (EST.on ? 'ligado' : 'desligado') + ' (a=' + EST.a + ', dz=' + EST.dz + ', ang=' + EST.dzAng + ', n=' + EST.n + ', dzs=' + EST.dzS + ', plano=' + EST.plano + ')',
      'Perdeu o alvo: ' + lostCount + 'x',
      'FPS: ' + fps,
      'Tela: ' + screen.width + 'x' + screen.height + ' @' + devicePixelRatio,
      'Navegador: ' + ua
    ].join('\n');
    try { await navigator.clipboard.writeText(txt); $('copy').textContent = 'Copiado! Cole no chat'; }
    catch (e) { prompt('Copie o diagnóstico:', txt); }
  });
</script>
</body>
</html>
